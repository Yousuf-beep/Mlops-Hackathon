[project]
name = "pulsegrid-backend"
version = "0.1.0"
description = "PulseGrid — enterprise API analytics and performance-management platform"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- web ---------------------------------------------------------------
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",                # reverse proxy client + test client
    # --- data --------------------------------------------------------------
    "sqlmodel>=0.0.22,<0.1",           # Pydantic v2 models + SQLAlchemy 2.x tables
    "psycopg[binary]>=3.2,<4.0",       # PostgreSQL driver (postgresql+psycopg://)
    "alembic>=1.14,<2.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # --- auth --------------------------------------------------------------
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    # passlib 1.7.4 reads bcrypt.__about__, which bcrypt 5 removed; pin to 4.x
    # so the backend loads without an emitted-then-fatal warning path.
    "bcrypt>=4.0,<5.0",
    # --- scheduling --------------------------------------------------------
    "apscheduler>=3.10,<4.0",          # in-process jobs; no broker, no worker image
    # --- ml (implemented in phase 3; installed now so the image never changes)
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "statsmodels>=0.14,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# Lint / format                                                                #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*.mako", ".venv", "__pycache__"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes  — correctness baseline
# I    isort                   — deterministic import order
# UP   pyupgrade               — keep syntax at the py312 level
# B    flake8-bugbear          — catch real bug patterns (mutable defaults, ...)
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic templates its migrations; unused imports and long lines are generated.
"alembic/*" = ["E501", "F401"]
# FastAPI's dependency-injection idiom is a function call in a default argument.
"app/routers/*" = ["B008"]
"app/auth/dependencies.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# The local `alembic/` directory would otherwise make isort classify the
# installed `alembic` package as first-party.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------- #
# Tests                                                                        #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
    # Starlette nudges towards httpx2; FastAPI's TestClient still ships httpx.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
