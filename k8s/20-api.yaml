# The PulseGrid API.
#
# Migrations run in an init container rather than in the container command: with
# two replicas, `alembic upgrade head && uvicorn ...` runs the migration twice
# concurrently against one schema. As an init container it completes before the
# server binds, so a pod never serves traffic against a schema it does not
# expect, and Alembic's version table makes the second pod's run a no-op.
apiVersion: v1
kind: Service
metadata:
  name: pulsegrid-api
  namespace: pulsegrid
  labels:
    app.kubernetes.io/name: pulsegrid
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsegrid-api
  namespace: pulsegrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsegrid
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: migrate
          image: pulsegrid-api:dev
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: pulsegrid-config }
            - secretRef: { name: pulsegrid-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      containers:
        - name: api
          image: pulsegrid-api:dev
          command:
            ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: pulsegrid-config }
            - secretRef: { name: pulsegrid-secrets }
          readinessProbe:
            # /health runs a real SELECT 1, so "ready" means "can serve
            # queries", not merely "the process started".
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Slower than readiness on purpose: a database blip should pull the
            # pod out of the Service, not restart it.
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
