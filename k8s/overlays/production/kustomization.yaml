# Production. This is what `kubectl apply -k k8s/` resolves to by default —
# see the pointer at the repo-root `k8s/kustomization.yaml` — because the base
# layer was already written as the production configuration (2 API/web
# replicas, HPA, prod-sized resource requests). This overlay adds almost
# nothing on top of it; it exists so "production" has an explicit, named
# target next to `qa` and `dev` that `kubectl diff`, a GitOps tool, or a
# person can point at directly, instead of the base being an implicit default
# no overlay actually owns.
#
# The one real difference from the base: image tags. The base's `:dev` tags
# are locally-built, for `docker compose`; production points at published
# images on Docker Hub.
#
# Why Docker Hub rather than the GHCR packages CI also pushes: a GHCR package
# inherits its repository's visibility and starts private, so an anonymous
# `kubectl apply` against a cluster with no pull secret gets ImagePullBackOff.
# These Docker Hub repositories are public and verified pullable. CI still
# publishes to GHCR on every push to `main` (see `.github/workflows/ci.yml`) —
# that remains the SHA-tagged provenance trail; this is the deployable target.
#
# Pin `newTag` to a released version rather than `latest` before anything real
# depends on this: `latest` means a redeploy silently changes what runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulsegrid

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: production

images:
  - name: pulsegrid-api
    newName: docker.io/ammaartech/pulsegrid-api
    newTag: v1.0.0
  - name: pulsegrid-web
    newName: docker.io/ammaartech/pulsegrid-web
    newTag: v1.0.0
