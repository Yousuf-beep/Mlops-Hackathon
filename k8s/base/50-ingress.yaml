# Everything enters through the web Service, which already fronts the API. One
# backend means one place where SSE buffering has to be disabled, rather than
# two paths with subtly different proxy settings.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsegrid
  namespace: pulsegrid
  annotations:
    # Without this the ingress controller buffers `text/event-stream` and the
    # dashboard's live updates arrive in clumps — or not at all.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: pulsegrid.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsegrid-web
                port:
                  number: 80
