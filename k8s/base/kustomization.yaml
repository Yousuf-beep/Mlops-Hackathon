# The base layer: every workload PulseGrid needs, with no environment-specific
# opinions baked in beyond what a sane default looks like. Never applied
# directly — `../overlays/{production,qa,dev}` each lay their own namespace,
# image tags and a handful of patches on top of this. See `k8s/README.md` for
# which overlay is which and `kubectl apply -k k8s/` (the repo-root pointer)
# for the one that runs by default.
#
# Kustomize rather than Helm: what varies between environments (namespace,
# image tag, a few replica counts and a hostname) is expressible as overlay
# patches, and that's cheaper than a values file and a template language for
# four workloads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulsegrid

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 10-postgres.yaml
  - 20-api.yaml
  - 30-demo-target.yaml
  - 40-web.yaml
  - 50-ingress.yaml
  - 60-hpa.yaml

commonLabels:
  app.kubernetes.io/name: pulsegrid
  app.kubernetes.io/part-of: pulsegrid

images:
  - name: pulsegrid-api
    newTag: dev
  - name: pulsegrid-web
    newTag: dev
