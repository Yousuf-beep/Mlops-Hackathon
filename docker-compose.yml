# PulseGrid local stack: PostgreSQL + API + a synthetic upstream to monitor.
#
#   cp .env.example .env && docker compose up --build
#
# The image tag for PostgreSQL is pinned to a specific minor line on purpose —
# `latest` would silently change the server version between developer machines
# and CI, and time-series index behaviour is exactly the kind of thing that
# should not drift underneath us.

name: pulsegrid

# Every service carries the same environment label, and the dashboard's
# infrastructure panel files services under whichever of development / QA /
# production it names. One variable moves the whole stack between them —
# `PULSEGRID_ENV=qa docker compose up -d` and the services appear under QA —
# and the k8s overlays stamp the equivalent `app.kubernetes.io/environment`,
# so a cluster deployment is classified by the same rule with no extra config.
x-environment-labels: &environment-labels
  pulsegrid.environment: "${PULSEGRID_ENV:-development}"

services:
  db:
    image: postgres:17-alpine
    container_name: pulsegrid-db
    restart: unless-stopped
    labels: *environment-labels
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegrid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulsegrid}
      # Fail fast on an unset password rather than starting a trust-auth server.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsegrid} -d ${POSTGRES_DB:-pulsegrid}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pulsegrid-api:dev
    container_name: pulsegrid-api
    restart: unless-stopped
    labels:
      <<: *environment-labels
      # This API's root is a 404 by design; /docs is the page a person opening
      # it actually wants. Nothing in a port mapping can know that, so the
      # service declares it and the dashboard links straight there.
      pulsegrid.path: "/docs"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reachable as `db`, which
      # overrides whatever localhost URL .env carries for host-side tooling.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pulsegrid}:${POSTGRES_PASSWORD:-pulsegrid_dev_password}@db:5432/${POSTGRES_DB:-pulsegrid}
      DEMO_TARGET_URL: http://demo-target:8001
    # Migrations run before the server binds, so the API never serves requests
    # against a schema it does not expect.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount for hot reload. The virtualenv lives at /opt/venv, outside
      # this mount, so it survives.
      - ./backend:/app
      # The Docker socket, which is what lets the dashboard's infrastructure
      # panel discover the running stack — its services, their published ports
      # and the localhost URLs those resolve to — instead of repeating a
      # hand-maintained list that drifts the moment a port changes.
      #
      # `:ro` makes the socket *file* read-only; it does not make the Engine API
      # read-only, because the Engine has no such mode. What actually bounds
      # this is the code above it: `app/infra/engine.py` issues two GETs and
      # nothing else. Still, a socket is a socket — this belongs in a local
      # stack, not in front of untrusted traffic. Delete this line to turn the
      # feature off; discovery then degrades to a panel that says the runtime
      # is unreachable, and nothing else changes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The API runs as an unprivileged uid (see backend/Dockerfile) and the socket
    # is group-readable only. Joining the socket's group grants exactly that one
    # read, without making the process root. Docker Desktop owns the socket
    # root:root, hence the default of 0; on a Linux host it is usually the
    # `docker` group — `stat -c '%g' /var/run/docker.sock` gives the number.
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  demo-target:
    # Reuses the backend image — one build, one thing to push. It only ever
    # runs a different entrypoint module.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pulsegrid-api:dev
    container_name: pulsegrid-demo-target
    restart: unless-stopped
    labels: *environment-labels
    command: ["uvicorn", "app.demo_target:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    # The dashboard: static bundle on nginx, which also reverse-proxies /v1 to
    # the API. Serving both from one origin means the browser never makes a
    # cross-origin request, so CORS never enters the picture and the SSE stream
    # passes through unbuffered.
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pulsegrid-web:dev
    container_name: pulsegrid-web
    restart: unless-stopped
    labels: *environment-labels
    depends_on:
      api:
        condition: service_started
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "5173:8080"

  loadgen:
    # Drives real traffic through the reverse proxy (see load/k6/traffic.js)
    # so the dashboard shows a live system rather than the prober's occasional
    # heartbeat. Runs on its own in this container; PulseGrid never talks to
    # k6 directly. `restart: unless-stopped` re-runs the (finite) traffic
    # pattern in a loop, so the fleet never goes quiet on its own.
    #
    # To run PulseGrid without synthetic load: `docker compose up --scale loadgen=0`,
    # or comment this service out.
    image: grafana/k6:latest
    container_name: pulsegrid-loadgen
    restart: unless-stopped
    labels: *environment-labels
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    volumes:
      - ./load/k6:/scripts:ro
    command: ["run", "--no-usage-report", "/scripts/traffic.js"]

volumes:
  pgdata:
    name: pulsegrid-pgdata
